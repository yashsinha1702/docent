appId: com.yashsinha.docent
productName: Docent
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/node-pty/**"
extraResources:
  - from: ../../vendor/pairwatch/pairwatch
    to: pairwatch
    filter:
      - "**/*"
      - "!tests/**"
      - "!.claude-plugin/types/**"
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  identity: null
linux:
  target: [AppImage]
  category: Development
