<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Docent: an eye watching the work, on the app's night-blue plate. The plate sits inside the 1024
       canvas the way macOS icons do (824 square, 100 margin); scripts/make-icon.mjs renders build/icon.png. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <path d="M196 512 Q512 136 828 512 Q512 888 196 512 Z" fill="url(#lid)"/>
  <circle cx="512" cy="512" r="156" fill="#0b1120"/>
  <circle cx="512" cy="512" r="98" fill="none" stroke="#a78bfa" stroke-width="30"/>
  <circle cx="562" cy="462" r="34" fill="#f5f3ff"/>
</svg>
